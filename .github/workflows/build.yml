name: Build Jar
on: [push, workflow_dispatch] # Сборка запустится при пуше или вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Скачиваем ваш код

      - name: Set up JDK 17 # Укажите нужную версию (8, 11, 17 или 21)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build # Запуск сборки

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar # Где искать готовый файл
